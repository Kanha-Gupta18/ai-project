[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalguard-motor-temperature"
version = "0.1.0"
description = "Explainable electric motor rotor-temperature estimation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "ThermalGuard project contributors" }
]
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<1.9",
  "seaborn>=0.13,<1",
  "streamlit>=1.54,<1.55",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
explain = [
  "shap>=0.46,<1",
]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "nbformat>=5.10,<6",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
all = [
  "thermalguard-motor-temperature[explain,notebook,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
